name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: EfeBerk4y
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23121211&color_dots=%23E8E5DE,%23FFC9C3,%23FF8A7D,%23FF3D2E,%23D9301F
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FF3D2E&color_dots=%23161B22,%235A1712,%23992318,%23D9301F,%23FF3D2E

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
