name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: EfeBerk4y
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%233E84FF&color_dots=%23EBEDF2,%23FFC4BF,%23FF8C83,%23FF3B2F,%23C42A20
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%233E84FF&color_dots=%23161B22,%234A1915,%23862A22,%23D1352A,%23FF3B2F

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
