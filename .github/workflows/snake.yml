name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: EfeBerk4y
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23E11D2A&color_dots=%23EBE6E6,%23F4A3A3,%238A141C,%23C3121E,%23FF4A4A
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23E11D2A&color_dots=%23161011,%234C0E13,%238A141C,%23C3121E,%23FF4A4A

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
