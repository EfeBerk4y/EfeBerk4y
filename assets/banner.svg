<path fill="#F5F5F5" d="M30 200 L34 178 L22 182 L32 160 L18 160 L32 140 L20 136 L36 120 L26 112 L42 100 L36 90 L54 74 L60 4 L88 46 C104 48 116 54 126 64 L134 70 C150 76 168 86 184 94 L194 98 L198 104 L194 110 L182 114 L150 120 L132 122 L152 128 C156 132 152 138 144 140 L120 148 L126 158 L110 156 L114 170 L98 164 L100 180 L86 174 L84 200 Z"/>
<path fill="#0A0A0A" d="M64 22 L80 46 L68 52 Z"/>
<path fill="#0A0A0A" d="M186 96 L196 100 L198 104 L194 109 L186 106 Z"/>
<path fill="none" stroke="#0A0A0A" stroke-width="2.5" stroke-linejoin="round" d="M106 72 L124 70 L134 76"/>
<path class="eye" fill="#E11D2A" d="M110 78 L130 79 L116 86 Z"/>
<path fill="none" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="round" d="M180 112 L140 120 L118 124"/></g>
<text x="130" y="80" class="mono" font-size="14" font-weight="700" fill="#F5F5F5" letter-spacing="4">EFE BERKAY ALAN</text>
<text x="1120" y="80" text-anchor="end" class="mono" font-size="13" fill="#6B6B6B" letter-spacing="3">SAMSUN · TÜRKİYE</text>
<g class="h">
  <text x="78" y="196" class="sans" font-size="64" font-weight="700" fill="#F5F5F5" letter-spacing="-1">Building the web,</text>
  <text x="78" y="268" class="sans" font-size="64" font-weight="700" fill="#F5F5F5" letter-spacing="-1">one product <tspan fill="#E11D2A">at a time.</tspan></text>
  <text x="80" y="322" class="sans" font-size="20" fill="#A3A3A3">Software Developer at Jetkolay. Websites, web applications and product sites.</text>
  <text x="80" y="352" class="sans" font-size="17" font-style="italic" fill="#6B6B6B">Jetkolay'de yazılım geliştiriciyim. Web siteleri, web uygulamaları ve ürün siteleri.</text>
</g>
<line x1="80" y1="396" x2="1120" y2="396" stroke="#242424"/>
<text x="80" y="448" class="sans" font-size="30" font-weight="700" fill="#F5F5F5">2023</text><text x="80" y="474" class="mono" font-size="12" fill="#A3A3A3" letter-spacing="1">BUILDING SINCE</text><text x="80" y="494" class="sans" font-size="13" font-style="italic" fill="#6B6B6B">beri üretiyorum</text><text x="350" y="448" class="sans" font-size="30" font-weight="700" fill="#F5F5F5">17</text><text x="350" y="474" class="mono" font-size="12" fill="#A3A3A3" letter-spacing="1">PORTFOLIO PROJECTS</text><text x="350" y="494" class="sans" font-size="13" font-style="italic" fill="#6B6B6B">portfolyo projesi</text><line x1="322" y1="420" x2="322" y2="496" stroke="#242424"/><text x="620" y="448" class="sans" font-size="30" font-weight="700" fill="#F5F5F5">3</text><text x="620" y="474" class="mono" font-size="12" fill="#A3A3A3" letter-spacing="1">COMPANIES WORKED AT</text><text x="620" y="494" class="sans" font-size="13" font-style="italic" fill="#6B6B6B">çalıştığım firma</text><line x1="592" y1="420" x2="592" y2="496" stroke="#242424"/><text x="890" y="448" class="sans" font-size="30" font-weight="700" fill="#F5F5F5">PHP · JS</text><text x="890" y="474" class="mono" font-size="12" fill="#A3A3A3" letter-spacing="1">CORE STACK</text><text x="890" y="494" class="sans" font-size="13" font-style="italic" fill="#6B6B6B">ana teknolojiler</text><line x1="862" y1="420" x2="862" y2="496" stroke="#242424"/>
