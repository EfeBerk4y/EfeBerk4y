<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img">
<style>
.sans{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace}
@keyframes fade{from{opacity:0}}@keyframes up{from{opacity:0;transform:translateY(8px)}}
.eye{animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{opacity:.4}}</style>

<defs>
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#FFFFFF" stroke-opacity=".045"/></pattern>
  <radialGradient id="fadeG" cx=".75" cy=".35" r=".75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="fadeM"><rect width="1200" height="540" fill="url(#fadeG)"/></mask>
  <radialGradient id="red" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#E11D2A" stop-opacity=".22"/><stop offset="1" stop-color="#E11D2A" stop-opacity="0"/></radialGradient>
  <linearGradient id="wm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".055"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="clip"><rect width="1200" height="540" rx="20"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="540" fill="#0A0A0A"/>
  <rect width="1200" height="540" fill="url(#grid)" mask="url(#fadeM)"/>
  <circle cx="1010" cy="170" r="300" fill="url(#red)"/>
  <g transform="translate(780,60) scale(2.1)"><path fill="none" d="M48 70 L44 14 L72 50 Z"/>
