<path fill="none" d="M64 22 L80 46 L68 52 Z"/>
<path fill="none" d="M186 96 L196 100 L198 104 L194 109 L186 106 Z"/>
<path fill="none" stroke="none" stroke-width="2.5" stroke-linejoin="round" d="M106 72 L124 70 L134 76"/>
<path class="eye" fill="#7A1219" d="M110 78 L130 79 L116 86 Z"/>
<path fill="none" stroke="none" stroke-width="2.5" stroke-linecap="round" d="M180 112 L140 120 L118 124"/></g>
  <rect y="0" width="1200" height="3" fill="#E11D2A"/>
</g>
<rect x=".5" y=".5" width="1199" height="539" rx="20" fill="none" stroke="#242424"/>
