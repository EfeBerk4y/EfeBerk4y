<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img">
<style>
.sans{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace}
.w{fill:none;stroke:#00B3B3;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0;animation:draw 2.4s ease-out backwards}
.eye{fill:#3FE0E0;animation:fade .6s 2.4s backwards, glow 3s 3s ease-in-out infinite}
.nose{fill:#00B3B3;animation:fade .6s 2s backwards}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes fade{from{opacity:0}}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}
.star{fill:#F2F7F7;opacity:.15;animation:tw 4s ease-in-out infinite}@keyframes tw{50%{opacity:.7}}
.in{animation:fade 1s .2s backwards}
</style>
