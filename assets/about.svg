<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img">
<style>
.sans{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace}
@keyframes fade{from{opacity:0}}@keyframes up{from{opacity:0;transform:translateY(8px)}}
</style>

<rect x=".5" y=".5" width="1199" height="339" rx="16" fill="#111111" stroke="#242424"/>
<line x1="600" y1="44" x2="600" y2="296" stroke="#242424"/>
<text x="52" y="66" class="mono" font-size="12" fill="#E11D2A" letter-spacing="3">ENGLISH</text><text x="52" y="106" class="sans" font-size="19" fill="#F5F5F5">I build websites and web applications,</text><text x="52" y="136" class="sans" font-size="19" fill="#F5F5F5">from the first idea to the live product.</text><text x="52" y="166" class="sans" font-size="19" fill="#F5F5F5">I care about clean interfaces, fast pages</text><text x="52" y="196" class="sans" font-size="19" fill="#F5F5F5">and code that is easy to maintain.</text><text x="52" y="240" class="mono" font-size="13" fill="#6B6B6B">now</text><text x="182" y="240" class="sans" font-size="16" fill="#A3A3A3">Mükellef Portal website</text><text x="52" y="270" class="mono" font-size="13" fill="#6B6B6B">learning</text><text x="182" y="270" class="sans" font-size="16" fill="#A3A3A3">TypeScript, React, cloud</text><text x="52" y="300" class="mono" font-size="13" fill="#6B6B6B">studying</text><text x="182" y="300" class="sans" font-size="16" fill="#A3A3A3">Atatürk University</text>
<text x="644" y="66" class="mono" font-size="12" fill="#E11D2A" letter-spacing="3">TÜRKÇE</text><text x="644" y="106" class="sans" font-size="19" fill="#F5F5F5">Fikirden canlı ürüne kadar web siteleri</text><text x="644" y="136" class="sans" font-size="19" fill="#F5F5F5">ve web uygulamaları geliştiriyorum.</text><text x="644" y="166" class="sans" font-size="19" fill="#F5F5F5">Sade arayüz, hızlı sayfa ve bakımı kolay</text><text x="644" y="196" class="sans" font-size="19" fill="#F5F5F5">kod benim için önemli.</text><text x="644" y="240" class="mono" font-size="13" fill="#6B6B6B">şu an</text><text x="774" y="240" class="sans" font-size="16" fill="#A3A3A3">Mükellef Portal sitesi</text><text x="644" y="270" class="mono" font-size="13" fill="#6B6B6B">öğreniyorum</text><text x="774" y="270" class="sans" font-size="16" fill="#A3A3A3">TypeScript, React, bulut</text><text x="644" y="300" class="mono" font-size="13" fill="#6B6B6B">okul</text><text x="774" y="300" class="sans" font-size="16" fill="#A3A3A3">Atatürk Üniversitesi</text>
</svg>
