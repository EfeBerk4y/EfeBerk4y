<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img">
<style>
.sans{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace}
.wolf{animation:rise 1.2s ease-out backwards}
.glow{animation:pulse 2.8s ease-in-out infinite}
@keyframes rise{from{opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.ember{fill:#FF3B30;opacity:.35;animation:float 6s linear infinite}@keyframes float{0%{transform:translateY(0);opacity:0}20%{opacity:.8}100%{transform:translateY(-90px);opacity:0}}
</style>
<defs>
