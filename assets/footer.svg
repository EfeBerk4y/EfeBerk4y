FF3B3B" stroke-opacity=".55" stroke-width="1.4" stroke-linejoin="round"/><polygon points="0,-150 70,-138 98,-98 62,-22 0,-42" fill="#4C0E13" stroke="#FF3B3B" stroke-opacity=".55" stroke-width="1.4" stroke-linejoin="round"/><polygon points="0,-125 38,-112 22,-48 0,-30" fill="#7A161D" stroke="#FF3B3B" stroke-opacity=".55" stroke-width="1.4" stroke-linejoin="round"/><polygon points="98,-98 122,-82 155,-38 128,8 62,-22" fill="#2A080B" stroke="#FF3B3B" stroke-opacity=".55" stroke-width="1.4" stroke-linejoin="round"/><polygon points="128,8 190,-5 162,38 200,62 152,88 112,72" fill="#2A080B" stroke="#FF3B3B" stroke-opacity=".55" stroke-width="1.4" stroke-linejoin="round"/><polygon points="62,-22 128,8 112,42 42,30" fill="#110405" stroke="#FF3B3B" stroke-opacity=".55" stroke-width="1.4" stroke-linejoin="round"/><polygon points="0,-42 62,-22 42,30 30,82 0,96" fill="#4C0E13" stroke="#FF3B3B" stroke-opacity=".55" stroke-width="1.4" stroke-linejoin="round"/><polygon points="112,72 42,30 30,82 58,150 92,122" fill="#2A080B" stroke="#FF3B3B" stroke-opacity=".55" stroke-width="1.4" stroke-linejoin="round"/><polygon points="0,96 30,82 24,106 0,114" fill="#110405" stroke="#FF3B3B" stroke-opacity=".55" stroke-width="1.4" stroke-linejoin="round"/><polygon points="58,150 32,124 0,138 0,196 40,178" fill="#4C0E13" stroke="#FF3B3B" stroke-opacity=".55" stroke-width="1.4" stroke-linejoin="round"/><polygon points="0,114 24,106 32,124 0,138" fill="#3A0306"/><polygon points="24,108 16,108 20,128" fill="#D9D0D0"/><line x1="0" y1="-150" x2="0" y2="196" stroke="#000" stroke-opacity=".6" stroke-width="2"/><polygon class="glow" points="-106,4 -70,14 -50,26 -88,26" fill="#FF1A1A" filter="url(#fblur)"/><polygon points="-106,4 -70,14 -50,26 -88,26" fill="#FF2A2A"/><polygon points="-90,12 -68,17 -58,23 -82,23" fill="#FF9A8A"/><polygon class="glow" points="106,4 70,14 50,26 88,26" fill="#FF1A1A" filter="url(#fblur)"/><polygon points="106,4 70,14 50,26 88,26" fill="#FF2A2A"/><polygon points="90,12 68,17 58,23 82,23" fill="#FF9A8A"/></g></g>
</g>
<rect x=".5" y=".5" width="1199" height="239" rx="18" fill="none" stroke="#2A1A1C"/>
<text x="600" y="190" text-anchor="middle" class="mono" font-size="16" fill="#BDB3B4" letter-spacing="6">BUILD · BREAK · LEARN · EVOLVE</text>
