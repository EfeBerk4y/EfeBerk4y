</defs>
<circle r="250" fill="url(#famb)"/>
<circle r="212" fill="none" stroke="url(#fring)" stroke-width="16"/>
<circle r="190" fill="none" stroke="url(#fring)" stroke-width="2" opacity=".6"/>
